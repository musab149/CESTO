<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Cesto Admin — Panel de Administración</title>
    <script>
      /* The panel in the dark before its first paint, so a reload never
         flashes it white (src/lib/adminTheme.ts keeps it after). */
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('cesto-admin-theme') || 'null');
          var choice = (saved && saved.state && saved.state.choice) || 'system';
          if (choice === 'dark' || (choice === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-admin-theme', 'dark');
          }
        } catch (e) { /* light, then */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
