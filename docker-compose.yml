services:
  postgres:
    image: postgres:16-alpine
    container_name: grocery_app_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grocery_app_spain
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: grocery_app_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
